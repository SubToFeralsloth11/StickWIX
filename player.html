      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        color: #fff;
        font: 600 18px/1.4 ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* The visible height on phones, where 100% includes space under the browser bars. */
        height: 100dvh;
      }
      .player-stage {
        position: relative;
        flex: none;
      }
      .player-stage canvas {
        outline: none;
        /* Taps go to the game: no scrolling, pinch zoom or double-tap zoom delay. */
        touch-action: none;
      }
      .player-stage.pixel-art canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .player-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: inherit;
        font-size: 28px;
        cursor: pointer;
      }
      .player-overlay:focus-visible {
        outline: 3px solid #ffd166;
        outline-offset: -3px;
      }
      .player-message {
        max-width: 28em;
        padding: 24px;
        text-align: center;
      }
